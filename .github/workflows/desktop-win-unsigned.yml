name: Desktop Windows unsigned build (self)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-win-self
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 300
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space
        shell: pwsh
        run: |
          $paths = @('C:\hostedtoolcache\windows\Android') +
                   (Get-ChildItem 'C:\Program Files (x86)' -Filter 'Android' -ErrorAction SilentlyContinue | ForEach-Object FullName) +
                   @('C:\ghcup')
          foreach ($p in $paths) { if (Test-Path $p) { Remove-Item -Recurse -Force $p -ErrorAction SilentlyContinue } }
          Get-PSDrive C | Select-Object Used,Free

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Prepare .env.windows
        working-directory: apps/desktop
        shell: pwsh
        run: |
          @'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=production
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://harness-test.deepseek.com
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://harness.deepseek.com
          '@ | Set-Content -Encoding utf8NoBOM .env.windows
          Get-Content .env.windows

      - name: Package desktop win-x64 (unsigned)
        run: pnpm package:desktop:win:x64:unsigned

      - name: Locate installers
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'apps/desktop/.desktop-build') {
            Get-ChildItem 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts' -ErrorAction SilentlyContinue |
              Select-Object Name, Length | Format-Table -AutoSize
          }

      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-win-x64-unsigned
          path: apps/desktop/.desktop-build/**/*.exe
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
